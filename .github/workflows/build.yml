name: Build KebianOS ISO

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          apt-get update
          apt-get install -y live-build git

      - name: Dar permisos y compilar (modo rápido)
        run: |
          chmod +x build-ejemplo.sh
          ./build-ejemplo.sh

      - name: Subir ISO como artifact
        uses: actions/upload-artifact@v4
        with:
          name: kebianos-iso
          path: "*.iso"
